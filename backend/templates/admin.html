<!DOCTYPE html>
<html>
<head>
<title>Admin Dashboard</title>

<style>
body {
    font-family: Arial;
    background: #0f172a;
    color: white;
    text-align: center;
}

.stats {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin: 20px;
}

.card {
    background: #1e293b;
    padding: 15px;
    border-radius: 10px;
    width: 150px;
}

.safe { color: #22c55e; }
.danger { color: red; }
.sus { color: orange; }

.data-card {
    background: #1e293b;
    margin: 10px;
    padding: 10px;
    border-radius: 10px;
}
</style>

</head>

<body>

<h2> Admin Dashboard</h2>

<div class="stats">
    <div class="card">
        <h3>Total Users</h3>
        <p id="users">0</p>
    </div>

    <div class="card">
        <h3>Total Scans</h3>
        <p id="scans">0</p>
    </div>

    <div class="card">
        <h3>Dangerous</h3>
        <p id="danger">0</p>
    </div>
</div>

<div id="data"></div>

<script>
async function loadData(){
    const res = await fetch("/admin-data", {credentials:"include"});
    const data = await res.json();

    let html = "";
    let usersSet = new Set();
    let dangerCount = 0;

    data.forEach(item=>{
        usersSet.add(item.username);

        let color = "safe";
        if(item.status === "Dangerous"){
            color = "danger";
            dangerCount++;
        } else if(item.status === "Suspicious"){
            color = "sus";
        }

        html += `
        <div class="data-card">
            <b>User:</b> ${item.username} <br>
            <b>URL:</b> ${item.url} <br>
            <b class="${color}">${item.status}</b> (${item.score})
        </div>
        `;
    });

    document.getElementById("data").innerHTML = html;

    document.getElementById("users").innerText = usersSet.size;
    document.getElementById("scans").innerText = data.length;
    document.getElementById("danger").innerText = dangerCount;
}

loadData();
</script>

</body>
</html>
